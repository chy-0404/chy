<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness — 服务未就绪</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e0f14;
        color: #d6d9e0;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .card {
        max-width: 480px;
        padding: 32px 36px;
        background: #171923;
        border: 1px solid #2a2e3a;
        border-radius: 12px;
      }
      h1 { margin: 0 0 12px; font-size: 18px; color: #f2f4f8; }
      p { margin: 0 0 8px; line-height: 1.6; font-size: 14px; }
      code {
        display: inline-block;
        padding: 2px 8px;
        background: #0b0c10;
        border: 1px solid #2a2e3a;
        border-radius: 6px;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 13px;
      }
      .hint { color: #8a90a0; font-size: 13px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>DeepSeek Harness 服务未就绪</h1>
      <p>本地 Web GUI（<code>http://127.0.0.1:3080</code>）没有响应，桌面壳也未能自动拉起服务。</p>
      <p>请先在终端手动启动：</p>
      <p><code>dsh web</code></p>
      <p class="hint">启动成功后，回到本窗口按 <code>Ctrl+R</code> 刷新即可。</p>
    </div>
  </body>
</html>
